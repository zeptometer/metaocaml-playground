<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Run BER MetaOCaml programs in your browser.">
  <title>MetaOCaml Playground</title>
  <link rel="stylesheet" href="style.css">
  <script id="playground-script" data-worker-url="worker.min.js" src="playground.min.js" defer></script>
</head>
<body>
  <header class="topbar">
    <h1>MetaOCaml Playground</h1>
    <span class="tagline">BER MetaOCaml N153 · OCaml 5.3 · runs entirely in your browser</span>
    <nav>
      <a href="https://okmij.org/ftp/ML/MetaOCaml.html" target="_blank" rel="noopener">About MetaOCaml</a>
    </nav>
  </header>

  <main class="panes">
    <section class="pane editor-pane">
      <div id="editor1" class="editor"></div>
      <div class="toolbar">
        <span class="hint">Ctrl/⌘ + Enter to run</span>
        <button id="share" class="btn" title="Put the code in the URL and copy the link">Share</button>
        <button id="run" class="btn btn-primary" disabled>Run ▶</button>
      </div>
    </section>

    <section class="pane output-pane">
      <div class="pane-header">
        <span>Output</span>
        <button id="clear" class="btn btn-small">Clear</button>
      </div>
      <div id="output" class="output" aria-live="polite"></div>
    </section>
  </main>

<script type="text/plain" id="default-code">(* Welcome to the MetaOCaml playground!
   .< e >.   quotes e as code (a value of type 'a code)
   .~ e      splices the code value e into a quotation
   Runcode.run c   compiles and runs the code value c *)

(* A staged power function: the recursion happens at generation time *)
let rec spower n x =
  if n = 0 then .< 1 >.
  else if n mod 2 = 0 then .< let y = .~(spower (n / 2) x) in y * y >.
  else .< .~x * .~(spower (n - 1) x) >.

(* Generated code for x^7 *)
let power7_code = .< fun x -> .~(spower 7 .< x >.) >.

(* Compile it, then use it like any other function *)
let power7 = Runcode.run power7_code

let () = Printf.printf "2^7 = %d\n" (power7 2)
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Run BER MetaOCaml programs in your browser.">
  <title>MetaOCaml Playground</title>
  <link rel="stylesheet" href="style.css">
  <script id="playground-script" data-worker-url="worker.min.js" src="playground.min.js" defer></script>
</head>
<body>
  <header class="topbar">
    <h1>MetaOCaml Playground</h1>
    <span class="tagline">BER MetaOCaml N153 · OCaml 5.3 · runs entirely in your browser</span>
    <nav>
      <a href="https://okmij.org/ftp/ML/MetaOCaml.html" target="_blank" rel="noopener">About MetaOCaml</a>
    </nav>
  </header>

  <main class="panes">
    <section class="pane editor-pane">
      <div id="editor1" class="editor"></div>
      <div class="toolbar">
        <label class="examples" title="Replace the editor contents with an example">
          <span>Examples</span>
          <!-- value: file under examples/ without .ml; the first one is loaded by default.
               An example can also be opened directly with #example=<value>. -->
          <select id="examples" class="btn">
            <option value="spower">1. Plain spower</option>
            <optgroup label="Failed attempts">
              <option value="duplicate">2. Duplicated code</option>
              <option value="inner-let">3. let in the middle</option>
            </optgroup>
            <optgroup label="Let-insertion">
              <option value="genlet">4. With genlet</option>
              <option value="cps">5. With CPS</option>
              <option value="handler">6. With effect handlers</option>
            </optgroup>
          </select>
        </label>
        <span class="hint">Ctrl/⌘ + Enter to run</span>
        <button id="share" class="btn" title="Put the code in the URL and copy the link">Share</button>
        <button id="run" class="btn btn-primary" disabled>Run ▶</button>
      </div>
    </section>

    <section class="pane output-pane">
      <div class="pane-header">
        <span>Output</span>
        <button id="clear" class="btn btn-small">Clear</button>
      </div>
      <div id="output" class="output" aria-live="polite"></div>
    </section>
  </main>

</body>
</html>
